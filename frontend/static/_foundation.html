<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="meta.index.title">ZakhrafaAI</title>
<meta name="description" content="" data-i18n-attr="content:meta.index.description">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070B12">
<script src="/assets/js/boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="icon" href="/assets/img/ornament.svg" type="image/svg+xml">
<style>
  /* styles propres à la démo uniquement */
  .demo-h { font-size: var(--fs-xl); margin-block-end: var(--sp-4); }
  .demo-row { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: center; }
  .demo-hero { min-block-size: 80vh; display: grid; place-items: center; text-align: center; }
  .demo-hero .lead { margin-inline: auto; }
  .demo-stats { display: flex; justify-content: center; gap: var(--sp-10); flex-wrap: wrap; margin-block-start: var(--sp-10); }
  .demo-stats strong { display: block; font-family: var(--font-display); font-size: var(--fs-3xl); line-height: 1; }
  .demo-out { font-size: var(--fs-sm); color: var(--text-2); }
  .demo-out dt { color: var(--text-3); font-size: var(--fs-xs); }
  .demo-out dd { margin-block-end: var(--sp-3); }
</style>
</head>
<body data-page="landing">
<header id="site-header"></header>

<main id="main" tabindex="-1">
  <!-- Hero : treillis animé, passe sous l'en-tête transparent -->
  <section class="section lattice-host under-nav demo-hero">
    <div class="lattice" aria-hidden="true"></div>
    <div class="container stack" style="--gap: var(--sp-6); align-items: center;">
      <span class="eyebrow eyebrow--chip enter" data-i18n="hero.eyebrow">Zellige · Tapis · Broderie</span>
      <h1 class="h1 enter" style="--i:1; max-inline-size: 16ch;"><span data-i18n="hero.title">Créez des motifs</span><br><span class="text-grad">ZakhrafaAI</span></h1>
      <p class="lead enter" style="--i:2" data-i18n="hero.subtitle"></p>
      <div class="cluster enter" style="--i:3; justify-content: center;">
        <a class="btn btn--primary btn--lg" href="/studio"><span data-i18n="hero.cta_primary"></span><span class="js-icon" data-icon="arrow-end"></span></a>
        <a class="btn btn--ghost btn--lg" href="#how" data-i18n="hero.cta_secondary"></a>
      </div>
      <p class="text-sm subtle enter" style="--i:4" data-i18n="hero.note"></p>
      <div class="demo-stats enter" style="--i:5">
        <div><strong class="js-num" data-n="3"></strong><span class="muted text-sm" data-i18n="hero.stat.crafts"></span></div>
        <div><strong class="js-num" data-n="2"></strong><span class="muted text-sm" data-i18n="hero.stat.modes"></span></div>
        <div><strong class="js-num" data-n="3"></strong><span class="muted text-sm" data-i18n="hero.stat.languages"></span></div>
      </div>
    </div>
  </section>

  <!-- Cartes -->
  <section class="section" id="how">
    <div class="container">
      <header class="section-head reveal">
        <span class="eyebrow eyebrow--lines" data-i18n="crafts.eyebrow"></span>
        <h2 class="h2" data-i18n="crafts.title"></h2>
        <p class="lead" data-i18n="crafts.subtitle"></p>
      </header>
      <div class="grid grid--3">
        <article class="card card--interactive reveal" style="--i:0">
          <div class="card__media"><img src="/assets/img/sample_zellige.png" alt="" data-i18n-attr="alt:category.zellige.image_alt" loading="lazy"></div>
          <h3 class="card__title"><a class="stretched" href="/studio?category=zellige" data-i18n="category.zellige.name" style="text-decoration:none"></a></h3>
          <p class="card__text" data-i18n="category.zellige.desc"></p>
          <div class="card__footer"><span class="dot dot--zellige"></span><span class="meter" data-level="3"><i></i><i></i><i></i></span><span class="text-sm muted" data-level-key="complexity.high"></span></div>
        </article>
        <article class="card card--interactive reveal" style="--i:1">
          <div class="card__media"><img src="/assets/img/sample_tapis.png" alt="" data-i18n-attr="alt:category.tapis.image_alt" loading="lazy"></div>
          <h3 class="card__title"><a class="stretched" href="/studio?category=tapis" data-i18n="category.tapis.name" style="text-decoration:none"></a></h3>
          <p class="card__text" data-i18n="category.tapis.desc"></p>
          <div class="card__footer"><span class="dot dot--tapis"></span><span class="meter" data-level="2"><i></i><i></i><i></i></span><span class="text-sm muted" data-level-key="complexity.medium_high"></span></div>
        </article>
        <article class="card card--interactive reveal" style="--i:2">
          <div class="card__media"><img src="/assets/img/sample_broderie.png" alt="" data-i18n-attr="alt:category.broderie.image_alt" loading="lazy"></div>
          <h3 class="card__title"><a class="stretched" href="/studio?category=broderie" data-i18n="category.broderie.name" style="text-decoration:none"></a></h3>
          <p class="card__text" data-i18n="category.broderie.desc"></p>
          <div class="card__footer"><span class="dot dot--broderie"></span><span class="meter" data-level="1"><i></i><i></i><i></i></span><span class="text-sm muted" data-level-key="complexity.medium"></span></div>
        </article>
      </div>
    </div>
  </section>

  <!-- Composants -->
  <section class="section section--band lattice-host">
    <div class="lattice lattice--subtle" aria-hidden="true"></div>
    <div class="container grid grid--2" style="--gap: var(--sp-8)">
      <div class="glass stack" style="padding: var(--sp-6); --gap: var(--sp-5)">
        <h2 class="demo-h">Boutons</h2>
        <div class="demo-row">
          <button class="btn btn--primary" type="button" data-i18n="nav.cta"></button>
          <button class="btn btn--secondary" type="button" data-i18n="error.retry"></button>
          <button class="btn btn--ghost" type="button" data-i18n="common.close"></button>
          <button class="btn btn--quiet" type="button" data-i18n="footer.back_to_top"></button>
        </div>
        <div class="demo-row">
          <button class="btn btn--ai" type="button"><span class="js-icon" data-icon="sparkle"></span><span data-i18n="mode.ai.name"></span></button>
          <button class="btn btn--ai-solid" type="button"><span class="js-icon" data-icon="sparkle"></span><span data-i18n="mode.ai.name"></span></button>
          <button class="btn btn--primary" type="button" aria-busy="true"><span data-i18n="common.loading"></span></button>
          <button class="btn btn--primary" type="button" disabled data-i18n="nav.cta"></button>
        </div>
        <div class="demo-row">
          <button class="btn btn--secondary btn--sm" type="button"><span class="js-icon" data-icon="download"></span><span>PNG</span></button>
          <button class="btn btn--secondary btn--icon" type="button" aria-label="Copier"><span class="js-icon" data-icon="copy"></span></button>
          <button class="btn btn--ghost btn--icon" type="button" aria-label="Régénérer"><span class="js-icon" data-icon="refresh"></span></button>
          <a class="btn btn--ghost btn--sm" href="#how"><span data-i18n="nav.how"></span><span class="js-icon" data-icon="chevron-end"></span></a>
        </div>
        <button class="btn btn--primary btn--lg btn--block" type="button" id="demo-busy" data-i18n="nav.cta"></button>

        <h2 class="demo-h">Contrôle segmenté</h2>
        <div class="segmented" role="radiogroup" aria-label="Artisanat" id="demo-seg">
          <button type="button" class="segmented__option" role="radio" aria-checked="true" data-value="zellige"><span class="js-icon" data-icon="star"></span><span data-i18n="category.zellige.name"></span></button>
          <button type="button" class="segmented__option" role="radio" aria-checked="false" data-value="tapis"><span class="js-icon" data-icon="diamond"></span><span data-i18n="category.tapis.name"></span></button>
          <button type="button" class="segmented__option" role="radio" aria-checked="false" data-value="broderie"><span class="js-icon" data-icon="flower"></span><span data-i18n="category.broderie.name"></span></button>
        </div>
        <p class="demo-out" aria-live="polite">value = <bdi class="ltr" id="demo-seg-out">zellige</bdi></p>

        <h2 class="demo-h">Cartes-options (mode)</h2>
        <div class="option-grid" role="radiogroup" aria-label="Mode" id="demo-mode">
          <button type="button" class="option-card" role="radio" aria-checked="true" data-value="gan">
            <span class="option-card__title"><span class="js-icon" data-icon="bolt"></span><span data-i18n="mode.fast.name"></span></span>
            <span class="option-card__meta" data-i18n="mode.fast.speed"></span>
          </button>
          <button type="button" class="option-card option-card--ai" role="radio" aria-checked="false" data-value="diffusion">
            <span class="option-card__title"><span class="js-icon" data-icon="sparkle"></span><span data-i18n="mode.ai.name"></span></span>
            <span class="option-card__meta" data-i18n="mode.ai.speed"></span>
          </button>
        </div>
      </div>

      <div class="glass stack" style="padding: var(--sp-6); --gap: var(--sp-5)">
        <h2 class="demo-h">Formulaires</h2>
        <div class="field">
          <label class="field__label" for="demo-prompt">Prompt</label>
          <textarea class="textarea" id="demo-prompt" data-i18n-attr="placeholder:mode.ai.best_for"></textarea>
          <p class="field__hint" data-i18n="mode.ai.tagline"></p>
        </div>
        <div class="grid grid--2" style="--gap: var(--sp-4)">
          <div class="field">
            <label class="field__label" for="demo-seed">Seed</label>
            <input class="input input--ltr" id="demo-seed" inputmode="numeric" value="6798123">
          </div>
          <div class="field">
            <label class="field__label" for="demo-size" data-i18n="modes.row.resolution"></label>
            <input class="input" id="demo-size" aria-invalid="true" aria-describedby="demo-size-err" value="2000">
            <p class="field__error" id="demo-size-err" data-i18n="error.validation.size_range" data-i18n-params='{"min":128,"max":1024}'></p>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="demo-select" data-i18n="lang.label"></label>
          <select class="select" id="demo-select"><option data-i18n="lang.fr"></option><option data-i18n="lang.ar"></option><option data-i18n="lang.en"></option></select>
        </div>
        <details class="disclosure disclosure--boxed">
          <summary data-i18n="faq.q2"></summary>
          <div class="disclosure__body" data-i18n="faq.a2"></div>
        </details>

        <h2 class="demo-h">Badges &amp; puces</h2>
        <div class="demo-row">
          <span class="badge badge--ai"><span class="js-icon" data-icon="sparkle"></span><span data-i18n="badge.ai" data-i18n-params='{"model":"gemini-2.5-flash-image"}'></span></span>
          <span class="badge" data-i18n="badge.procedural"></span>
          <span class="badge badge--accent" data-i18n="badge.trained"></span>
          <span class="badge badge--info" data-i18n="badge.cached"></span>
          <span class="badge badge--success">OK</span>
          <span class="badge badge--danger">422</span>
        </div>
        <div class="demo-row" id="demo-chips">
          <button type="button" class="chip" aria-pressed="true" data-i18n="gallery.filter.all"></button>
          <button type="button" class="chip" aria-pressed="false"><span class="dot dot--zellige"></span><span data-i18n="category.zellige.name"></span></button>
          <button type="button" class="chip" aria-pressed="false"><span class="dot dot--tapis"></span><span data-i18n="category.tapis.name"></span></button>
          <button type="button" class="chip" aria-pressed="false"><span class="dot dot--broderie"></span><span data-i18n="category.broderie.name"></span></button>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container grid grid--2" style="--gap: var(--sp-8)">
      <div class="stack">
        <h2 class="demo-h">Notices</h2>
        <div class="notice notice--warning" role="status"><span class="js-icon" data-icon="info"></span><div class="notice__body"><p class="notice__title" data-i18n="notice.fallback"></p><p data-i18n="notice.daily_limit" data-i18n-params='{"n":50}'></p></div></div>
        <div class="notice notice--ai" role="status"><span class="js-icon" data-icon="sparkle"></span><div class="notice__body"><p data-i18n="notice.ip_limit" data-i18n-params='{"n":5}'></p></div></div>
        <div class="notice notice--danger" role="alert"><span class="js-icon" data-icon="alert"></span><div class="notice__body"><p class="notice__title" data-i18n="error.network"></p></div></div>
        <div class="notice notice--success" role="status"><span class="js-icon" data-icon="check"></span><div class="notice__body"><p data-i18n="error.validation.size_adjusted" data-i18n-params='{"n":256}'></p></div></div>

        <h2 class="demo-h">Squelettes</h2>
        <div class="card" aria-busy="true" style="max-inline-size: 360px">
          <span class="skeleton skeleton--block"></span>
          <span class="skeleton skeleton--title"></span>
          <span class="skeleton skeleton--text"></span>
          <span class="skeleton skeleton--text" style="inline-size: 70%"></span>
          <span class="sr-only" data-i18n="common.loading"></span>
        </div>
      </div>
      <div class="stack">
        <h2 class="demo-h">Formatage Intl &amp; http.js</h2>
        <dl class="demo-out panel" id="demo-fmt"></dl>
        <dl class="demo-out panel" id="demo-http"></dl>
        <button class="btn btn--secondary btn--sm" type="button" id="demo-http-err">Tester 404 / 422 (erreurs console attendues)</button>
        <div class="panel lattice-host" style="aspect-ratio: 1; max-inline-size: 280px; display:grid; place-items:center; text-align:center">
          <div class="lattice lattice--faint" aria-hidden="true"></div>
          <span class="js-icon" data-icon="star" data-size="48" style="color: var(--text-3)"></span>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { initI18n, t, apply, onLangChange, formatNumber, formatDate, formatTime, formatRelative, ltr, getLang, getLocale } from "/assets/js/i18n.js";
  import { initShell } from "/assets/js/shell.js";
  import { initRadioGroup, initReveal } from "/assets/js/ui.js";
  import { icon } from "/assets/js/icons.js";
  import { getJSON, postJSON, errorMessage } from "/assets/js/http.js";

  await initI18n("landing");
  initShell({ sectionLinks: [{ href: "#how", key: "nav.how" }, { href: "#faq", key: "nav.faq" }] });

  document.querySelectorAll(".js-icon").forEach((el) => {
    el.outerHTML = icon(el.dataset.icon, { size: Number(el.dataset.size) || 18 });
  });

  const seg = initRadioGroup(document.getElementById("demo-seg"), {
    onChange: (v) => (document.getElementById("demo-seg-out").textContent = v),
  });
  initRadioGroup(document.getElementById("demo-mode"));
  document.getElementById("demo-chips").addEventListener("click", (e) => {
    const c = e.target.closest(".chip");
    if (!c) return;
    document.querySelectorAll("#demo-chips .chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
  });
  const busy = document.getElementById("demo-busy");
  busy.addEventListener("click", () => {
    busy.setAttribute("aria-busy", "true");
    busy.textContent = t("common.loading");
    setTimeout(() => { busy.removeAttribute("aria-busy"); busy.textContent = t("nav.cta"); }, 1500);
  });

  // Rendu dépendant de la langue (texte composé, formats Intl)
  function renderDynamic() {
    document.querySelectorAll("[data-level-key]").forEach((el) => {
      el.textContent = t("crafts.complexity", { level: t(el.dataset.levelKey) });
    });
    document.querySelectorAll(".js-num").forEach((el) => (el.textContent = formatNumber(Number(el.dataset.n))));
    const fmt = document.getElementById("demo-fmt");
    const now = new Date();
    fmt.innerHTML = "";
    const row = (k, v) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); typeof v === "string" ? (dd.textContent = v) : dd.append(...v);
      fmt.append(dt, dd);
    };
    row("getLang / getLocale", `${getLang()} · ${getLocale()}`);
    row("formatNumber(1234567.8)", formatNumber(1234567.8));
    row("formatDate / formatTime", `${formatDate(now)} · ${formatTime(now)}`);
    row("formatRelative(-3 min / -2 j)", `${formatRelative(now.getTime() - 180000)} · ${formatRelative(now.getTime() - 2 * 864e5)}`);
    row("t('studio.meta.seed') + ltr(seed)", [t("palette.fes_bleu") + " — Seed ", ltr(6798123), " · ", ltr("256×256")]);
  }
  renderDynamic();
  onLangChange(renderDynamic);

  // http.js : succès, 404, 422, réseau
  const out = document.getElementById("demo-http");
  const show = (label, r) => {
    const dt = document.createElement("dt"); dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = `ok=${r.ok} status=${r.status} code=${r.code}` + (r.ok ? "" : ` → « ${errorMessage(r)} »`);
    dd.dir = "auto";
    out.append(dt, dd);
  };
  show("GET /api/meta", await getJSON("/api/meta"));
  show("GET /api/meta, timeout 1 ms (→ network)", await getJSON("/api/meta", { timeout: 1 }));
  document.getElementById("demo-http-err").addEventListener("click", async () => {
    show("GET /api/introuvable", await getJSON("/api/introuvable"));
    show("POST /api/generate {category:'x'}", await postJSON("/api/generate", { category: "x", engine: "gan" }));
  }, { once: true });

  initReveal();
</script>
</body>
</html>
