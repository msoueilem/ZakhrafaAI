services:
  zakhrafaai:
    build: .
    image: zakhrafaai:latest
    container_name: zakhrafaai
    restart: unless-stopped
    ports:
      # exposé uniquement en local : à publier via un reverse proxy
      - "127.0.0.1:${ZAKHRAFAAI_PORT:-8000}:8000"
    environment:
      # Rendu IA (mode « diffusion ») : sans clé, repli sur le procédural.
      # Valeurs interpolées depuis l'environnement ou le fichier .env à la
      # racine (lu automatiquement par Compose, jamais copié dans l'image).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-image}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-30}
      GEMINI_PER_IP_LIMIT: ${GEMINI_PER_IP_LIMIT:-5}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-90}
      # Assistant de prompt DeepSeek (/api/assist) : sans clé, endpoints en 503.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_DAILY_LIMIT: ${DEEPSEEK_DAILY_LIMIT:-500}
      DEEPSEEK_PER_IP_LIMIT: ${DEEPSEEK_PER_IP_LIMIT:-20}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-20}
    volumes:
      # compteurs journaliers Gemini et DeepSeek (survivent aux redémarrages)
      - zakhrafaai-data:/data

volumes:
  zakhrafaai-data:
